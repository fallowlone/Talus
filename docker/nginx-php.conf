# nginx in front of php-fpm for the tunnel tests: default FastCGI buffering, like most shared hosts.
server {
    listen 80;
    root /var/www/html;
    location ~ \.php$ {
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
    }
}
