[workspace]
resolver = "3"
members = ["crates/talus-core", "crates/talus-app", "crates/talus-server"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
talus-core = { path = "crates/talus-core" }
talus-server = { path = "crates/talus-server" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust", "derive", "native-tls-tls", "client_ed25519"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "column_decltype", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.27", features = ["v4", "serde"] }
thiserror = "2.0"
zeroize = "1.9"
directories = "6.0"
csv = "1.4"
quick-xml = "0.42.0"
futures-util = "0.3"
tracing = "0.1"
security-framework = "3.7"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
base64 = "0.22.1"
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = "0.36.2"
egui_plot = "0.37.0"
egui_kittest = "0.36.2"
rfd = "0.17.2"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "tokio-native-tls-comp"] }
mongodb = { version = "3.9.1", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
oracledb = "=26.0.0-beta.4"
snowflake-connector-rs = { version = "1.1", default-features = false, features = ["key-pair-auth"] }
ring = "0.17"
ab_glyph = "0.2"
epaint_default_fonts = "0.36"
flate2 = "1"
tokio-native-tls = "0.3"
url = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rust_xlsxwriter = { version = "0.99.1", default-features = false, features = ["constant_memory"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
