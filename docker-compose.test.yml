# Disposable databases for integration tests only. Data lives in tmpfs and disappears
# with the containers. Credentials are throwaway values for these local containers.
# Fixed project name: container names and ports do not depend on the checkout directory's name.
name: talus-test
services:
  postgres:
    # postgres:17 plus the pldebugger extension (PL/pgSQL debugger tests).
    build: { context: docker, dockerfile: postgres-debugger.Dockerfile }
    image: talus-test-postgres:17-pldebugger
    command: ["postgres", "-c", "shared_preload_libraries=plugin_debugger"]
    environment:
      POSTGRES_USER: talus
      POSTGRES_PASSWORD: talus_test_pw
      POSTGRES_DB: talus_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: talus_test_pw
      MYSQL_DATABASE: talus_test
      MYSQL_USER: talus
      MYSQL_PASSWORD: talus_test_pw
    ports: ["127.0.0.1:53306:3306"]
    tmpfs: ["/var/lib/mysql"]
  mssql:
    # SQL Server has no arm64 image: it runs under x86 emulation (Docker Desktop with Rosetta) and
    # needs ~1 minute to accept connections. Running it means accepting Microsoft's SQL Server EULA,
    # so it is opt-in: `MSSQL_ACCEPT_EULA=Y scripts/test-env.sh` (the profile is enabled there).
    profiles: ["mssql"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "${MSSQL_ACCEPT_EULA:-N}"
      MSSQL_SA_PASSWORD: Talus_Test_pw1
    ports: ["127.0.0.1:51433:1433"]
  oracle:
    # Oracle Database Free (23ai), community-built image with a native arm64 variant. About 2 GB of RAM and
    # a minute or two to accept connections, so it is opt-in: `TALUS_ORACLE=1 scripts/test-env.sh`.
    # `talus` gets the DBA role (+ debugger rights) from docker/oracle-init.sql; tests create and drop whole
    # accounts, kill sessions and debug PL/SQL. Never point the suite at a real database.
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: talus_test_pw
      APP_USER: talus
      APP_USER_PASSWORD: talus_test_pw
    volumes: ["./docker/oracle-init.sql:/container-entrypoint-initdb.d/01-talus.sql:ro"]
    ports: ["127.0.0.1:51521:1521"]
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 5s
      retries: 60
  # The PHP tunnel script (tunnel/talus-tunnel.php) on real web servers: Apache with mod_php, and nginx in front
  # of php-fpm (output buffering on, 5 workers: the strictest of the two). The tunnel reaches the database
  # containers through the host's published ports. `TALUS_TEST_PHP_URL=http://127.0.0.1:58080/talus-tunnel.php`
  # (or :58081) makes `cargo test -p talus-core --test php_tunnel` use them instead of `php -S`.
  php-apache:
    profiles: ["php"]
    image: php:8.3-apache
    environment: &php-env
      TALUS_TUNNEL_KEY: 0123456789abcdef0123456789abcdef-test-key
      TALUS_TUNNEL_ALLOW: host.docker.internal:55432,host.docker.internal:53306,host.docker.internal:56379
      TALUS_TUNNEL_ALLOW_HTTP: "1"
    volumes: ["./tunnel/talus-tunnel.php:/var/www/html/talus-tunnel.php:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:58080:80"]
  php-fpm:
    profiles: ["php"]
    image: php:8.3-fpm
    environment: *php-env
    volumes: ["./tunnel/talus-tunnel.php:/var/www/html/talus-tunnel.php:ro"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  php-nginx:
    profiles: ["php"]
    image: nginx:alpine
    depends_on: [php-fpm]
    volumes:
      - ./docker/nginx-php.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tunnel/talus-tunnel.php:/var/www/html/talus-tunnel.php:ro
    ports: ["127.0.0.1:58081:80"]
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "redis_test_pw"]
    ports: ["127.0.0.1:56379:6379"]
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongo_test_pw
    ports: ["127.0.0.1:57017:27017"]
    tmpfs: ["/data/db"]
  sshd:
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache openssh \
         && ssh-keygen -A \
         && adduser -D tunnel \
         && echo 'tunnel:tunnel_test_pw' | chpasswd \
         && sed -i -e 's/^#\?AllowTcpForwarding.*/AllowTcpForwarding yes/' -e 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
        CMD ["/usr/sbin/sshd", "-D", "-e"]
    ports: ["127.0.0.1:52222:22"]
